<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1014">
<!-- BODY-START -->
<title>Südnorwegen Solotour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile-first Reise-App. Startseite = Routenwahl (3 Karten mit Nacht-Leiste), Detailseite = Kopf + Inhalt + feste Tab-Leiste unten. Max. 760px Spalte. Bewusst nur dunkel (Wunsch des Nutzers). */
:root {
  --bg: #0a1014;
  --surface: #111a20;
  --surface-2: #172229;
  --line: #22313a;
  --fg: #e3ebee;
  --muted: #8597a1;
  --a: #62b6d8;      /* Variante A: Fjordblau */
  --b: #e2a75e;      /* Variante B: Fjell-Bernstein */
  --c: #86d9ab;      /* Variante C: Nordlichtgrün */
  --warn: #e9c46a;
  --bad: #ef8a76;
  --ok: #86d9ab;
  --route: var(--a);
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.5; margin: 0; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.08; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 8vw, 3rem); font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--route); text-underline-offset: 2px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------- Startseite ---------- */
.hero { position: relative; overflow: hidden; padding-block: 28px 22px; }
.hero::before { content: ""; position: absolute; inset: -40% -20% auto -20%; height: 120%; background:
  radial-gradient(60% 50% at 25% 40%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%),
  radial-gradient(50% 45% at 80% 30%, color-mix(in srgb, var(--a) 18%, transparent), transparent 70%);
  filter: blur(10px); pointer-events: none; }
.hero > * { position: relative; }
.hero .label { color: var(--c); }
.hero h1 { margin-top: 6px; }
.hero .sub { margin-top: 10px; color: var(--muted); max-width: 52ch; }
.ridge { display: block; width: 100%; height: 46px; margin-top: 18px; }
.ridge path { fill: none; stroke: var(--line); stroke-width: 1.5; }
.ridge path.hi { stroke: color-mix(in srgb, var(--c) 55%, var(--line)); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-family: var(--font-mono); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--muted); }

.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 26px; margin-bottom: 12px; }
.routes { display: grid; gap: 14px; }
.rcard { --route: var(--a); display: grid; gap: 12px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; position: relative; transition: border-color .15s, transform .15s; }
.rcard:hover { border-color: color-mix(in srgb, var(--route) 60%, var(--line)); }
.rcard:active { transform: scale(.99); }
.rcard .top { display: flex; align-items: center; gap: 12px; }
.badge { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; color: var(--bg); background: var(--route); }
.rcard h3 { font-size: 1.25rem; }
.rcard .sub { color: var(--muted); font-size: .9rem; }
.rcard .go { margin-left: auto; color: var(--route); font-size: 1.4rem; line-height: 1; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; font-size: .9rem; }
.facts div { min-width: 0; }
.facts .label { display: block; margin-bottom: 1px; }
.nights { display: flex; gap: 3px; }
.nights i { flex: 1; height: 8px; border-radius: 3px; background: color-mix(in srgb, var(--route) calc(var(--o) * 1%), var(--surface-2)); }
.nights-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .78rem; color: var(--muted); }
.nights-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: color-mix(in srgb, var(--route) calc(var(--o) * 1%), var(--surface-2)); }

.decide { display: grid; gap: 8px; }
.decide .opt { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: color-mix(in srgb, var(--route) 16%, transparent); color: var(--route); border: 1px solid color-mix(in srgb, var(--route) 35%, transparent); white-space: nowrap; }
.foot { padding-block: 26px 40px; color: var(--muted); font-size: .82rem; }

/* ---------- Detailseite ---------- */
.dhead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.dhead .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.back { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.back svg { width: 20px; height: 20px; }
.dhead .badge { width: 34px; height: 34px; font-size: 1.1rem; border-radius: 10px; }
.dhead .t { min-width: 0; }
.dhead .t b { display: block; font-family: var(--font-display); font-size: 1.1rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dhead .t span { font-size: .78rem; color: var(--muted); }
main.detail { padding-block: 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px); }
.lead { color: var(--muted); max-width: 60ch; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 9px 2px 8px; height: var(--nav-h); background: none; border: 0; color: var(--muted); font-size: .7rem; font-weight: 600; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--route); }

/* Tagesplan */
.daylist { display: grid; gap: 0; position: relative; }
.day { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.day::before { content: ""; position: absolute; left: 25px; top: 44px; bottom: 0; width: 2px; background: var(--line); }
.day:last-child::before { display: none; }
.dnum { display: grid; place-items: center; align-content: center; width: 52px; height: 52px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-family: var(--font-mono); line-height: 1.05; text-align: center; }
.dnum small { font-size: .62rem; color: var(--muted); letter-spacing: .05em; }
.dnum b { font-size: 1.15rem; font-weight: 500; }
.day.drive .dnum { border-color: color-mix(in srgb, var(--route) 55%, var(--line)); }
.day.drive .dnum b { color: var(--route); }
.day.today .dnum { background: var(--route); color: var(--bg); }
.day.today .dnum small, .day.today .dnum b { color: var(--bg); }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.dcard .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 8px; font-size: .78rem; background: var(--surface-2); color: var(--fg); font-family: var(--font-mono); white-space: nowrap; }
.pill.rest { color: var(--ok); }
.pill.drv { color: var(--route); }
.dcard .line { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; font-size: .92rem; }
.dcard .line svg { width: 16px; height: 16px; margin-top: 3px; color: var(--muted); }
.group-title { display: flex; align-items: center; gap: 10px; margin: 18px 0 12px; }
.group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.fold > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; margin-left: auto; font-family: var(--font-mono); color: var(--muted); font-size: 1.1rem; }
details.fold[open] > summary::after { content: "–"; }
details.fold > .body { padding: 0 16px 16px; display: grid; gap: 12px; }
.maps { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); text-decoration: none; font-size: .88rem; font-weight: 600; }
.btn svg { width: 16px; height: 16px; color: var(--route); flex: none; }
.btn.primary { background: var(--route); color: var(--bg); border-color: transparent; }
.btn.primary svg { color: var(--bg); }
.btn:disabled { opacity: .5; cursor: default; }

/* Orte / Infos */
.place { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.place header { display: grid; gap: 2px; }
ul.facts-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
ul.facts-list li { display: grid; gap: 2px; font-size: .94rem; }
ul.facts-list li b { font-size: .8rem; font-family: var(--font-mono); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--route); }
.note { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 9%, var(--surface)); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: .92rem; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-weight: 500; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Touren */
.hike { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.hike .hd { display: flex; gap: 10px; align-items: start; justify-content: space-between; }
.hike .nums { display: flex; flex-wrap: wrap; gap: 6px; }
.lvl-leicht { color: var(--ok); } .lvl-mittel { color: var(--warn); } .lvl-schwer { color: var(--bad); }

/* Checkliste */
.check { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .94rem; }
.check:last-child { border-bottom: 0; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--route); }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--route); }

/* Nähe */
.here { display: grid; gap: 12px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--route) 45%, var(--line)); border-radius: var(--r); padding: 16px; }
.poi { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.poi:last-child { border-bottom: 0; }
.poi .ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: var(--surface-2); color: var(--route); }
.poi .ic svg { width: 20px; height: 20px; }
.poi .nm { font-weight: 600; font-size: .95rem; }
.poi .ds { font-size: .8rem; color: var(--muted); }
.poi .km { font-family: var(--font-mono); font-size: .9rem; text-align: right; white-space: nowrap; }
.poi .km a { display: block; font-family: var(--font-body); font-size: .78rem; margin-top: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: .84rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--route) 18%, var(--surface)); color: var(--route); border-color: color-mix(in srgb, var(--route) 45%, var(--line)); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.on i { background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }

/* Chat */
.chat { display: grid; gap: 12px; }
.msgs { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: .95rem; overflow-wrap: anywhere; }
.msg.user { justify-self: end; background: var(--route); color: var(--bg); border-bottom-right-radius: 5px; }
.msg.bot { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.bot p + p, .msg.bot ul + p, .msg.bot p + ul { margin-top: 8px; }
.msg.bot ul { margin: 0; padding-left: 20px; }
.msg.bot li + li { margin-top: 3px; }
.msg.err { justify-self: stretch; max-width: none; background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); font-size: .88rem; }
.typing { color: var(--muted); font-style: italic; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { text-align: left; padding: 7px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: .84rem; color: var(--fg); }
.composer { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.composer form { display: flex; gap: 8px; align-items: end; padding-block: 10px; }
.composer textarea { flex: 1; min-width: 0; resize: none; max-height: 140px; padding: 11px 13px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1.35; }
.composer button { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 0; background: var(--route); color: var(--bg); display: grid; place-items: center; }
.composer button svg { width: 20px; height: 20px; }
body.chat-open main.detail { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 96px); }
.keybox { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; font-size: .9rem; }
.keybox input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--font-mono); font-size: 14px; }
.small { font-size: .82rem; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATEN – aus «Motorhome-Solotour Südnorwegen» (Stand 14.10.2026)
   ========================================================= */
const L = (t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
const P4N = id => `https://park4night.com/de/place/${id}`;
const KOMOOT = id => `https://www.komoot.com/smarttour/${id}`;
const GM = path => `https://www.google.com/maps/dir/${path}`;

const TRIP = { start: new Date("2026-10-23T15:00:00+02:00"), end: new Date("2026-11-06T12:00:00+01:00") };

/* Gemeinsame Anreise und Rückreise */
const ANREISE = [
  { iso: "2026-10-23", date: "Fr 23.10.", title: "Oberdiessbach – Bern – Basel – Freiburg i. Br.", km: "190 km", h: "2,5 h", start: "15:00", stay: `${L("Stellplatz Europa-Park-Stadion", P4N(227026))}, Suwonallee 1 (ca. 15 € / 24 h)`, poi: "freiburg", map: GM("Oberdiessbach/Suwonallee+1,+Freiburg+im+Breisgau") },
  { iso: "2026-10-24", date: "Sa 24.10.", title: "Freiburg – Karlsruhe – Frankfurt – Kassel – Hannover", km: "615 km", h: "7,5–8 h", start: "09:00", stay: `${L("Stellplatz Hannover Nord", P4N(313379))}, Schulenburger Landstr. 130B (18 € / 24 h)`, poi: "hannover", map: GM("Suwonallee+1,+Freiburg+im+Breisgau/52.4070,9.7117"), note: "In Deutschland gross einkaufen – Norwegen ist teurer und sonntags zu." },
  { iso: "2026-10-25", date: "So 25.10.", title: "Hannover Nord – Hamburg – Kiel Norwegenkai, Fähre 14:00", km: "240 km", h: "3 h", start: "07:30", stay: "Color Line Kiel – Oslo (Ankunft Mo 10:00)", poi: "kiel", map: GM("52.4070,9.7117/Norwegenkai,+Kiel"), note: "Zeitumstellung in der Nacht: eine Stunde mehr Schlaf. Check-in bis 12:00." },
];
const RUECKREISE = [
  { iso: "2026-11-04", date: "Mi 4.11.", title: "Fähre Oslo – Kiel, 14:00 (Check-in bis 12:00)", km: "15 km", h: "30 min", start: "", stay: "Color Line (Ankunft Kiel Do 10:00)", poi: "hjortnes", map: GM("Bogstad+Camping,+Oslo/Color+Line+Terminal+Hjortnes,+Oslo") },
  { iso: "2026-11-05", date: "Do 5.11.", title: "Kiel – Hamburg – Hannover – Kassel – Frankfurt – Bruchsal", km: "695 km", h: "8,5–9 h", start: "10:30", stay: `${L("Wohnmobilpark Bruchsal", P4N(390289))}, Sportzentrum 7 (25 € / 24 h)`, poi: "bruchsal", map: GM("Norwegenkai,+Kiel/49.1359,8.5871"), note: "Wenn es stockt: schon im Raum Frankfurt übernachten und Freitag 06:30 los." },
  { iso: "2026-11-06", date: "Fr 6.11.", title: "Bruchsal – Karlsruhe – Basel – Bern – Oberdiessbach", km: "335 km", h: "ca. 4 h", start: "07:30", stay: "Zu Hause, ca. 11:30", poi: null, map: GM("49.1359,8.5871/Oberdiessbach") },
];

/* Orte mit Koordinaten (Plätze aus dem Plan; ca.-Werte, Google-Maps-Links sind exakt) */
const POI = {
  freiburg:  { n: "Stellplatz Europa-Park-Stadion", t: "camp", lat: 48.0215, lng: 7.8296, d: "Freiburg, Strom + Entsorgung", u: P4N(227026) },
  hannover:  { n: "Stellplatz Hannover Nord", t: "camp", lat: 52.4070, lng: 9.7117, d: "inkl. Entsorgung", u: P4N(313379) },

function nightsBar(r) {
  const total = r.nights.reduce((s, n) => s + n[1], 0);
  const op = [100, 70, 48, 32, 20];
  const seen = {};
  let idx = 0;
  const bars = [], legend = [];
  r.nights.forEach(([name, n]) => {
    if (!(name in seen)) { seen[name] = op[idx++ % op.length]; legend.push(`<span style="--o:${seen[name]}">${esc(name)}</span>`); }
    for (let i = 0; i < n; i++) bars.push(`<i style="--o:${seen[name]}" title="${esc(name)}"></i>`);
  });
  return `<div class="stack" style="gap:6px"><div class="nights" aria-label="${total} Nächte: ${esc(r.nights.map(n => n[0] + " " + n[1]).join(", "))}">${bars.join("")}</div><div class="nights-legend">${legend.join("")}</div></div>`;
}

function haversine(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function countdown() {
  const now = today();
  const day = 864e5;
  if (now < TRIP.start) {
    const d = Math.ceil((TRIP.start - now) / day);
    return { big: d, small: d === 1 ? "Tag bis Abfahrt" : "Tage bis Abfahrt" };
  }
  if (now <= TRIP.end) {
    const d = Math.floor((now - new Date("2026-10-23T00:00:00+02:00")) / day) + 1;
    return { big: d, small: "Reisetag von 15" };
  }
  return { big: "✓", small: "Reise zurück" };
}

let geo = { watch: null, pos: null, err: null, filter: "alle" };
function geoAvailable() { return "geolocation" in navigator; }
function startGeo() {
  if (!geoAvailable()) { geo.err = "Dieser Browser liefert keinen Standort."; rerenderTab(); return; }
  geo.err = null;
  try {
    geo.watch = navigator.geolocation.watchPosition(p => {
      geo.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
      store.set("lastpos", geo.pos);
      if (state.tab === "naehe") rerenderTab();
    }, e => {
      geo.err = e.code === 1 ? "Standortfreigabe abgelehnt oder hier gesperrt. In den Browser-Einstellungen für diese Seite erlauben." : "Standort gerade nicht verfügbar (kein GPS-Signal?).";
      stopGeo(false); rerenderTab();
    }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 });
    store.set("geoOn", true);
  } catch { geo.err = "Standort ist in dieser Ansicht gesperrt."; }
  rerenderTab();
}
function stopGeo(remember = true) {
  if (geo.watch != null) { try { navigator.geolocation.clearWatch(geo.watch); } catch {} }
  geo.watch = null;
  if (remember) store.set("geoOn", false);
}
function currentDay(r) {
  const days = allDays(r);
  const t = isoToday();
  if (t < days[0].iso) return { d: days[0], when: "before" };
  if (t > days[days.length - 1].iso) return null;
  return { d: days.find(d => d.iso === t) || days[0], when: "now" };
}
function poiList(r) {
  const tonight = currentDay(r);
  return Object.entries(POI).filter(([, p]) => !p.v || p.v.includes(r.key)).map(([id, p]) => ({ id, ...p, tonight: tonight && tonight.d.poi === id }));
}

function md(text) {
  const lines = esc(text).split(/\n/);
  let out = "", list = false;
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  for (const ln of lines) {
    const m = ln.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (m) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    if (list) { out += "</ul>"; list = false; }
    const t = ln.replace(/^#+\s*/, "").trim();
    if (t) out += "<p>" + inline(t) + "</p>";
  }
  if (list) out += "</ul>";
  return out;
}

async function askApi(system, turns, onText, signal) {
  const key = store.get("apikey", "");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-beta": "server-side-fallback-2026-07-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: "claude-opus-5-5", max_tokens: 16000, stream: true, system, messages: turns, output_config: { effort: "medium" }, fallbacks: "default" }),
  });
  if (!res.ok) {
    let msg = "Fehler " + res.status;
    try { const j = await res.json(); msg += ": " + (j.error && j.error.message || ""); } catch {}
    if (res.status === 401) msg = "Der API-Schlüssel wurde abgelehnt. Bitte prüfen oder neu eingeben.";
    if (res.status === 429) msg = "Zu viele Anfragen – kurz warten und nochmals senden.";
    throw new Error(msg);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", stop = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const data = chunk.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join("");
      if (!data) continue;
      let ev; try { ev = JSON.parse(data); } catch { continue; }
      if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") { text += ev.delta.text; onText(text); }
      else if (ev.type === "message_delta" && ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason;
      else if (ev.type === "error") throw new Error((ev.error && ev.error.message) || "Unbekannter Fehler");
    }
  }
  if (stop === "refusal" && !text) throw new Error("Diese Frage wurde nicht beantwortet. Bitte anders formulieren.");
  return text;
}

async function sendChat(text) {
  const r = ROUTES[state.route];

  const mode = chatMode();
  if (mode === "none" || mode === "pending") return;
  const msgs = store.get(chatKey(r), []);
  msgs.push({ role: "user", content: text });
  store.set(chatKey(r), msgs);
  rerenderTab();
  const box = $("#msgs");
  const bubble = document.createElement("div");
  bubble.className = "msg bot"; bubble.innerHTML = '<p class="typing">Denkt nach …</p>';
  box.appendChild(bubble);
  bubble.scrollIntoView({ block: "end", behavior: "smooth" });
  chat.busy = true; chat.ctl = new AbortController(); setSendState();
  let turns = msgs.slice(-20);
  while (turns.length && turns[0].role !== "user") turns = turns.slice(1);
  const onText = t => { bubble.innerHTML = md(t); };
  try {
    let answer;
    if (mode === "claude") {
      const input = [{ role: "user", content: systemPrompt(r) + "\n\n=== FRAGE ===\n" + turns[0].content }, ...turns.slice(1)];
      const res = await sampleFn(input, { cache: false, signal: chat.ctl.signal, onText: ({ text }) => onText(text) });
      answer = res.text;
    } else {
      answer = await askApi(systemPrompt(r), turns, onText, chat.ctl.signal);
    }
    msgs.push({ role: "assistant", content: answer || "(keine Antwort)" });
    store.set(chatKey(r), msgs);
  } catch (e) {
    const code = e && e.code;
    if (code === "cancelled" || (e && e.name === "AbortError")) { bubble.remove(); }
    else {
      const copy = code === "not_granted" ? "Der Chat wurde in dieser Ansicht nicht erlaubt. Lade die Seite neu, um nochmals gefragt zu werden."
        : code === "rate_limited" ? "Gerade zu viele Anfragen – in einer Minute nochmals versuchen."
        : (e && e.message) || "Die Antwort ist fehlgeschlagen. Bitte nochmals senden.";
      bubble.className = "msg err"; bubble.textContent = copy;
      msgs.pop(); store.set(chatKey(r), msgs);
    }
  } finally {
    chat.busy = false; chat.ctl = null; setSendState();
    if (!$(".msg.err")) rerenderTab();
  }
}
function setSendState() {
  const b = $("#sendbtn"); if (!b) return;
  b.innerHTML = chat.busy ? svg("stop") : svg("send");
  b.setAttribute("aria-label", chat.busy ? "Stoppen" : "Senden");
}

/* ---------- Rendering ---------- */
function renderDetail() {
  const r = ROUTES[state.route];
  document.documentElement.style.setProperty("--route", r.color);
  document.body.classList.toggle("chat-open", state.tab === "chat");
  const showComposer = state.tab === "chat";
  return `
  <div class="dhead"><div class="wrap">
    <button class="back" data-go="" aria-label="Zur Routenwahl">${svg("back")}</button>
    <span class="badge">${r.key}</span>
    <div class="t"><b>${esc(r.name)}</b><span>${esc(r.title)}</span></div>
  </div></div>
  <main class="detail wrap" id="tabbody">${tabBody(r)}</main>
  ${showComposer ? composerHTML() : ""}
  <nav class="tabbar" aria-label="Bereiche"><div class="in">
    ${TABS.map(t => `<button class="tab" data-tab="${t.id}" ${state.tab === t.id ? 'aria-current="page"' : ""}>${svg(t.icon)}${t.label}</button>`).join("")}
  </div></nav>`;
}
function tabBody(r) {
  switch (state.tab) {
    case "orte": return tabOrte(r);
    case "touren": return tabTouren(r);
    case "naehe": return tabNaehe(r);
    case "infos": return tabInfos(r);
    case "chat": return tabChat(r);
    default: return tabPlan(r);
  }
}
function rerenderTab() {
  const el = $("#tabbody");
  if (!el || !state.route) return;
  const opens = [...el.querySelectorAll("details.fold")].map(d => d.open);
  el.innerHTML = tabBody(ROUTES[state.route]);
  if (opens.length) el.querySelectorAll("details.fold").forEach((d, i) => { if (i < opens.length) d.open = opens[i]; });
}
function render() {
  const app = $("#app");
  app.innerHTML = state.route ? renderDetail() : renderStart();
  if (state.route) store.set("chosen", state.route);
  if (state.tab === "chat") { const m = $("#msgs"); if (m && m.lastElementChild) m.lastElementChild.scrollIntoView({ block: "end" }); }
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-tab],[data-suggest],[data-chat],[data-geo],[data-filter]");
  if (!t) return;
  if (t.hasAttribute("data-go")) { go(t.dataset.go || null); return; }
  if (t.dataset.tab) { go(state.route, t.dataset.tab); return; }
  if (t.dataset.suggest) { sendChat(t.dataset.suggest); return; }
  if (t.dataset.chat === "clear") { if (chat.ctl) chat.ctl.abort(); store.set(chatKey(ROUTES[state.route]), []); rerenderTab(); return; }
  if (t.dataset.chat === "forget") { store.set("apikey", ""); rerenderTab(); return; }
  if (t.dataset.geo === "start") { startGeo(); return; }
  if (t.dataset.geo === "stop") { stopGeo(); rerenderTab(); return; }
  if (t.dataset.filter) { geo.filter = t.dataset.filter; rerenderTab(); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.todo) {
    const checked = store.get("todos", Object.fromEntries(TODOS.filter(x => x.done).map(x => [x.id, true])));
    checked[t.dataset.todo] = t.checked;
    store.set("todos", checked);
    rerenderTab();
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "chatform") {
    if (chat.busy) { chat.ctl && chat.ctl.abort(); return; }
    const ta = $("#chatinput"); const v = ta.value; ta.value = ""; ta.style.height = "";
    sendChat(v);
  }
  if (e.target.id === "keyform") {
    const v = $("#apikey").value.trim();
    if (v) { store.set("apikey", v); rerenderTab(); }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "chatinput") { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px"; }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "chatinput" && e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover: hover)").matches) {
    e.preventDefault(); $("#chatform").requestSubmit();
  }
});

readHash();
render();
if (store.get("geoOn", false) && geoAvailable()) startGeo();
</script>
</body>
</html>
